<!DOCTYPE html>
<html lang="en">
<head>

    <title>TEJAS PATEL</title>
    <style>
 * {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
font-family: Arial, Helvetica, sans-serif;
background-color: white;
color: #333;
}

.header {
position: relative;
max-width: 1500px;
margin: auto;
text-align: center;
}

.header-image {
width: 100%;
height: 600px;
object-fit: cover;
display: block;
}

.header-title {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
border: 1px solid #ddd;
padding: 30px 50px;
color: white;
background-color: rgba(0, 0, 0, 0.15);
}

.header-title h1 {
font-size: 50px;
letter-spacing: 5px;
margin-bottom: 15px;
}

.header-title h3 {
font-size: 20px;
letter-spacing: 3px;
}

.navbar {
position: absolute;
bottom: -16px;
left: 50%;
transform: translateX(-50%);
display: flex;
background-color: #eee;
border-radius: 5px;
overflow: hidden;
}

.navbar a,
.mobile-navbar a {
text-decoration: none;
color: #333;
padding: 14px 25px;
display: block;
transition: 0.3s;
}

.navbar a:hover,
.mobile-navbar a:hover {
background-color: #555;
color: white;
}

.mobile-navbar {
display: none;
justify-content: center;
background-color: #eee;
padding: 10px;
}

.mobile-navbar a {
padding: 10px 15px;
}

.content {
max-width: 1000px;
margin: 50px auto 0;
padding: 20px;
}

.content > img {
width: 100%;
height: auto;
display: block;
margin-top: 20px;
}

.contact {
background-color: #eee;
margin-top: 30px;
padding: 40px 30px;
}

.contact h2 {
text-align: center;
font-size: 28px;
}

.contact hr {
border: none;
border-top: 1px solid #ccc;
margin: 20px 0;
}

.contact p {
line-height: 1.7;
margin-bottom: 25px;
}

.form-group {
margin-bottom: 20px;
}

.form-group label {
display: block;
margin-bottom: 8px;
}

.form-group input,
.form-group textarea {
width: 100%;
padding: 12px;
border: 1px solid #ccc;
font-size: 16px;
font-family: inherit;
}

.form-group textarea {
resize: vertical;
}

button {
width: 100%;
padding: 14px;
background-color: #333;
color: white;
border: none;
font-size: 16px;
cursor: pointer;
transition: 0.3s;
}

button:hover {
background-color: #555;
}

@media (max-width: 768px) {

.header-image {
    height: 400px;
}

.header-title {
    padding: 20px;
    width: 80%;
}

.header-title h1 {
    font-size: 30px;
    letter-spacing: 3px;
}

.header-title h3 {
    font-size: 15px;
}

.navbar {
    display: none;
}

.mobile-navbar {
    display: flex;
}

.content {
    margin-top: 20px;
    padding: 15px;
}

.contact {
    padding: 30px 20px;
}

}

@media (max-width: 480px) {

.header-image {
    height: 300px;
}

.header-title h1 {
    font-size: 24px;
}

.header-title h3 {
    font-size: 12px;
}

.mobile-navbar {
    flex-wrap: wrap;
}

.mobile-navbar a {
    padding: 8px 12px;
}

}
    </style>
</head>
<body>

<header class="header">
    <img src="https://www.w3schools.com/w3images/photographer.jpg" alt="Jane Doe" class="header-image">

    <div class="header-title">
        <h1>PARMAR TEJAS</h1>
        <h3>PHOTOGRAPHER</h3>
    </div>

    <nav class="navbar">
        <a href="#">Home</a>
        <a href="#portfolio">Portfolio</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<nav class="mobile-navbar">
    <a href="#">Home</a>
    <a href="#portfolio">Portfolio</a>
    <a href="#contact">Contact</a>
</nav>

<main class="content" id="portfolio">

    <img src="https://www.w3schools.com/w3images/ocean.jpg" alt="Ocean">
    <img src="https://www.w3schools.com/w3images/ocean2.jpg" alt="Ocean">
    <img src="https://www.w3schools.com/w3images/falls2.jpg" alt="Waterfall">
    <img src="https://www.w3schools.com/w3images/mountainskies.jpg" alt="Mountain Sky">
    <img src="https://www.w3schools.com/w3images/mountains2.jpg" alt="Mountains">

    <section class="contact" id="contact">
        <h2>Contact</h2>
        <hr>

        <p>
            my name is tejas patel and become is my lerning step is very heartfully
            answer me so good well
        </p>

        <form action="#" method="post">

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter Your Name" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter Your Email" required>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Enter Your Feedback" required></textarea>
            </div>

            <button type="submit">Send</button>
        </form>
    </section>

</main>

</body>
</html>
