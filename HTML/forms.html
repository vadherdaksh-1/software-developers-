<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>TEJASBHAI PARMAR</title>
</head>
<body>
    <div>

        <form align="center">
             <p>
             <label for="name:-">name</label>
             <input type="text" id="user name" name="user name" placeholder="user name" required>
             </p>

             <p>
             <label for="email:-">email</label>
             <input type="email" id="user email" name="user email" placeholder="user email">
             </p>

             <p>
             <label for="password:-">password</label>
             <input type="password" id="user password" name="user password" placeholder="user password">
             </p>

             <p>
             <label for="age:-">age</label>
             <input type="number" id="age" name="age" min="1" max="100">
             </p>

             <p>
             <label for="phone:-">phone</label>
             <input type="tel" id="phone" name="phone" placeholder="ente phone number">
             </p>

             <p>
             <label for="website:-">website</label>
             <input type="url" id="website" name="website" placeholder="https://google.com">
             </p>


             <p>
             <label for="DOB:-">Date Of Birth</label>
             <input type="date" id="DOB" name="DOB">
             </p>

             <p>
             <label for="time:-">appoinment time</label>
             <input type="datetime-local" id="meeting" name="meeting">
             </p>

             <p>
             <label for="MONTH:-">joining month</label>
             <input type="month" id="month" name="month">
             </p>

             <p>
             <label for="week:-">select week</label>
             <input type="week" id="week" name="week">
             </p>

            <p>Gender</p>
            <label>
            <input type="radio" name="Gender" value="Male">
            Male
            </label>

            <label>
            <input type="radio" name="Gender" value="Female">
            Female
            </label>

            <label>
            <input type="radio" name="Gender" value="other">
            other
            </label>

            <p>Skills</p>

            <label>
            <input type="Checkbox" name="Skills" value="html">
            html
            </label>

            <label>
            <input type="Checkbox" name="Skills" value="Css">
            Css
            </label>

            <label>
            <input type="Checkbox" name="Skills" value="Python">
            Python
            </label>

             <p>
             <label for="Resume:-">Upload Resume</label>
             <input type="File" id="Resume" name="Resume">
             </p>
<!-- 
             <p>
             <label for="Hidden:-">Hidden</label>
             <input type="Hidden" name="Sudent-id" value="101">
             </p> -->

             <p>
             <label for="Search:-">Search</label>
             <input type="Search" id="Search" name="Search" placeholder="Search">
             </p>

             <p>
             <label for="color:-">Choose color</label>
             <input type="Color" id="color" name="color">
             </p>

             <p>
             <label for="Volume:-">Volume</label>
             <input type="Range" id="Volume" name="Volume" min="1" max="100" value="50">
             </p>

             <p>
             <label for="readonly:-">readonly</label>
             <input type="Text" name="Course" value="html">
             </p>

             <p>
             <label for="Disabled:-">Disabled</label>
             <input type="Text" value="Not Available">
             </p>

             <p>
             <label for="comments:-">Comments</label>
             <input type="5" id="50" placeholder="Write Your Comments here">
             </p>
             
             <p>
             <input type="checkbox" name="Terms">
             I Agree To The Terms And Conditions.
             </p>

          
            <button type="Submit">Register</button>

            <button type="Submit">Reset</button>   

            <button type="Submit">Login</button>


        </form>
    </div>

</body>
</html>
